name: Build

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

concurrency:
  # One run per branch; a new push cancels the previous run.
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble, test and verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # Only the JDK that runs Gradle is set up here. The JDK used to compile
      # (java-version in libs.versions.toml) is provisioned by the foojay
      # toolchain resolver declared in settings.gradle.kts.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The app reads TMDB_API_KEY from local.properties. A missing key yields
      # an empty BuildConfig field rather than a build failure, so CI supplies a
      # placeholder and does not depend on the secret being configured.
      - name: Provide TMDB API key
        run: echo "TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}" >> local.properties

      - name: Check formatting
        run: ./gradlew spotlessCheck

      - name: Assemble debug
        run: ./gradlew assembleDebug

      - name: Unit tests
        run: ./gradlew test

      - name: Architecture tests
        run: ./gradlew :test:konsist:test

      - name: Android Lint
        run: ./gradlew lint

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results-*.html
          retention-days: 7
          if-no-files-found: ignore
